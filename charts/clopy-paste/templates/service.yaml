apiVersion: v1
kind: Service
metadata:
  name: {{ include "clopy-paste.fullname" . }}
  labels:
    {{- include "clopy-paste.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "clopy-paste.selectorLabels" . | nindent 4 }}
