{{- if and .Values.ingress.enabled (not .Values.openshift.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clopy-paste.fullname" . }}
  labels:
    {{- include "clopy-paste.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "clopy-paste.fullname" . }}
                port:
                  name: http
{{- end }}
