# Generated by ydk ci init v1.6.0. Re-run 'ydk ci init --gitlab --force' to regenerate.
# Every job only calls make (pipeline logic lives in the Makefile); no remote includes, no
# marketplace components. Tools come from the runner image (ci.gitlab.image).
stages:
  - lint
  - test
  - build
  - scan
  - e2e

variables:
  SCAN_ENABLED: "false"  # the scan job runs only when this is "true"
  E2E_ENABLED: "false"   # hand edit: golang image has no docker/kind; enable on a runner that does

default:
  image: "golang:1.27"

lint:
  stage: lint
  script:
    - make lint

test:
  stage: test
  script:
    - make test

build:
  stage: build
  script:
    - make build

scan:
  stage: scan
  script:
    - make scan
  rules:
    - if: '$SCAN_ENABLED == "true"'

e2e:
  stage: e2e
  script:
    - make e2e
  rules:
    - if: '$E2E_ENABLED == "true"'
