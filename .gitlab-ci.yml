# Generated by ydk ci init v1.6.0. Re-run 'ydk ci init --gitlab --force' to regenerate.
# Every job only calls make (pipeline logic lives in the Makefile); no remote includes, no
# marketplace components. Tools come from the runner image (ci.gitlab.image).
stages:
  - lint
  - test
  - build

default:
  image: "golang:1.27"

# ADR-011: no trivy DB mirror on GitLab yet, image scan stays off.
variables:
  SCAN_ENABLED: "false"

lint:
  stage: lint
  script:
    - make lint

test:
  stage: test
  script:
    - make test

build:
  stage: build
  script:
    - make build
