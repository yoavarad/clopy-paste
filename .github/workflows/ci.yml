# Generated by ydk ci init v1.6.0. Re-run 'ydk ci init --force' to regenerate.
name: CI

on:
  pull_request:
  push:
    branches: [main]  # your default branch; edit if it is not main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  YDK_VERSION: "1.6.0"

jobs:
  ci:
    name: Make targets and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # setup-go v6 reads the toolchain (else go) directive from go.mod; no hard-coded Go version here.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Hand edit (re-apply after ydk ci init --force): scan/e2e need trivy, kind, helm, kubectl.
      - name: Install trivy, kind, helm, kubectl (pinned downloads)
        run: |
          sh scripts/ci-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Pipeline logic lives in the Makefile; this workflow only calls make (set ci.make_targets).
      - name: make lint
        run: make lint
      - name: make test
        run: make test
      - name: make build
        run: make build
      - name: make scan
        run: make scan
      # Hand edit: test/e2e cases are TDD red stubs until tasks #36/#37 implement them.
      # #37 removes continue-on-error so e2e blocks again.
      - name: make e2e
        continue-on-error: true
        run: make e2e
      - uses: astral-sh/setup-uv@v7
      - name: Install ydk
        run: uv tool install --python 3.13 "git+https://github.com/yoavarad/ydk@v${YDK_VERSION}"
      - name: ydk verify
        run: ydk verify run --trigger git:pre-push --skip-plugin ai-code-review --skip-plugin spec-alignment
