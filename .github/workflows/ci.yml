# Generated by ydk ci init v1.6.0. Re-run 'ydk ci init --force' to regenerate.
name: CI

on:
  pull_request:
  push:
    branches: [main]  # your default branch; edit if it is not main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  YDK_VERSION: "1.6.0"

jobs:
  # Docs-only changes (docs/**, *.md, .ydk/retros/**) skip image and e2e. Skipped jobs still
  # count as passing for required checks.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base="$BASE_SHA" ;;
            push) base="$BEFORE_SHA" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD) || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if printf '%s
' "$files" | grep -qvE '^(docs/|\.ydk/retros/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Lint, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # setup-go v6 reads the toolchain (else go) directive from go.mod; no hard-coded Go version here.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Hand edit (re-apply after ydk ci init --force): lint needs helm.
      - uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh', 'scripts/ci-tools.sh') }}
      - name: Install trivy, kind, helm, kubectl (pinned downloads)
        run: |
          sh scripts/ci-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Pipeline logic lives in the Makefile; this workflow only calls make (set ci.make_targets).
      - name: make lint
        run: make lint
      - name: make test
        run: make test
      - uses: astral-sh/setup-uv@v7
      - name: Install ydk
        run: uv tool install --python 3.13 "git+https://github.com/yoavarad/ydk@v${YDK_VERSION}"
      # make lint/test already ran fmt, vet, test, vendor and helm lint; skip those plugins here.
      - name: ydk verify
        run: >-
          ydk verify run --trigger git:pre-push
          --skip-plugin ai-code-review --skip-plugin spec-alignment
          --skip-plugin go-fmt --skip-plugin go-vet --skip-plugin go-test
          --skip-plugin go-vendor --skip-plugin helm-lint

  image:
    name: Build and scan image
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh', 'scripts/ci-tools.sh') }}
      - id: date
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.d }}
          restore-keys: trivy-db-
      - name: Install trivy, kind, helm, kubectl (pinned downloads)
        run: |
          sh scripts/ci-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@v3
      - name: make build
        env:
          CACHE_GHA: "1"
        run: make build
      - name: make scan
        run: make scan
      - name: Save image
        run: |
          . scripts/env.sh
          docker save "$IMAGE" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  e2e:
    name: End-to-end
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh', 'scripts/ci-tools.sh') }}
      - name: Install trivy, kind, helm, kubectl (pinned downloads)
        run: |
          sh scripts/ci-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load image
        run: gunzip -c image.tar.gz | docker load
      # Hand edit: test/e2e cases are TDD red stubs until tasks #36/#37 implement them.
      # #37 removes continue-on-error so e2e blocks again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/clopy-paste
          key: env-images-${{ hashFiles('scripts/tools.sh') }}
      - name: Preload env images (docker save cache)
        run: sh scripts/env-images.sh
      - name: make e2e
        continue-on-error: true
        env:
          E2E_SKIP_BUILD: "1"
        run: make e2e
