# Generated by ydk ci init v1.6.0. Re-run 'ydk ci init --force' to regenerate.
name: YDK spec integrity

on:
  pull_request:
    paths:
      - "docs/specs/**"
      - ".ydk/components/**"
      - ".ydk/schemas/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  YDK_VERSION: "1.6.0"

jobs:
  components:
    name: Component validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install ydk
        run: uv tool install --python 3.13 "git+https://github.com/yoavarad/ydk@v${YDK_VERSION}"
      - name: Validate components
        run: ydk component validate
